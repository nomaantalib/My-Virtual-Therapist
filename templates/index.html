<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AGI Therapist</title>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      .container {
        display: flex;
      }
      .input-section {
        flex: 1;
        padding: 20px;
      }
      .output-panel {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .output-div {
        flex: 1;
        border: 1px solid #ccc;
        padding: 10px;
        margin: 10px;
        overflow-y: auto;
        height: 200px;
      }
      .module-result {
        border: 1px solid #ddd;
        padding: 10px;
        margin: 5px 0;
      }
      button {
        margin: 5px;
        padding: 10px;
      }
      input,
      textarea {
        width: 100%;
        margin: 5px 0;
      }
      #loading {
        text-align: center;
        font-size: 20px;
        color: blue;
      }
      video {
        width: 100%;
        max-width: 400px;
      }
    </style>
  </head>
  <body>
    <h1>AGI Therapist</h1>
    <div class="container">
      <div class="input-section">
        <h2>Live Audio and Camera Input</h2>
        <button id="startConvoBtn">Start Convo</button>
        <button id="stopConvoBtn" disabled>Stop Convo</button>
        <br />
        <video id="video" autoplay muted></video>
        <br />
      <div id="loading" style="display: none">Analyzing...</div>
      <div id="error_message" style="color: red; display: none;"></div>
        <div id="analysis_result">
          <h3>Analysis Results</h3>
          <div id="stt_result" class="module-result"></div>
          <div id="tone_result" class="module-result"></div>
          <div id="nlu_result" class="module-result"></div>
          <div id="facial_result" class="module-result"></div>
          <div id="memory_result" class="module-result"></div>
        </div>
      </div>
      <div class="output-panel">
        <div class="output-div" id="working_memory">
          <h3>Working Memory History</h3>
          <div id="working_content"></div>
        </div>
        <div class="output-div" id="long_term_memory">
          <h3>Long Term Memory History</h3>
          <div id="long_term_content"></div>
        </div>
        <div class="output-div" id="logs">
          <h3>Logs</h3>
          <div id="logs_content"></div>
        </div>
      </div>
    </div>
    <script>
      const socket = io();
      let mediaRecorder;
      let stream;
      let recordingInterval;

      const startConvoBtn = document.getElementById("startConvoBtn");
      const stopConvoBtn = document.getElementById("stopConvoBtn");
      const loading = document.getElementById("loading");
      const video = document.getElementById("video");

      function recordAndSend() {
        if (!stream) return;
        mediaRecorder = new MediaRecorder(stream);
        let chunks = [];
        mediaRecorder.ondataavailable = (event) => {
          chunks.push(event.data);
        };
        mediaRecorder.onstop = () => {
          const audioBlob = new Blob(chunks, { type: "audio/wav" });
          const reader = new FileReader();
          reader.onloadend = () => {
            const audioB64 = reader.result.split(",")[1];
            // Capture image
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext("2d").drawImage(video, 0, 0);
            canvas.toBlob((imageBlob) => {
              const imageReader = new FileReader();
              imageReader.onloadend = () => {
                const imageB64 = imageReader.result.split(",")[1];
                socket.emit("audio_data", { audio: audioB64, image: imageB64 });
                loading.style.display = "block";
                // Restart recording after short delay
                recordingInterval = setTimeout(recordAndSend, 1000);
              };
              imageReader.readAsDataURL(imageBlob);
            });
          };
          reader.readAsDataURL(audioBlob);
        };
        mediaRecorder.start();
        setTimeout(() => {
          if (mediaRecorder && mediaRecorder.state === "recording") {
            mediaRecorder.stop();
          }
        }, 4000); // Record 4 seconds
      }

      startConvoBtn.addEventListener("click", async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: true,
            video: true,
          });
          video.srcObject = stream;
          startConvoBtn.disabled = true;
          stopConvoBtn.disabled = false;
          recordAndSend();
        } catch (error) {
          alert("Error accessing microphone/camera: " + error.message);
        }
      });

      stopConvoBtn.addEventListener("click", () => {
        if (recordingInterval) {
          clearTimeout(recordingInterval);
        }
        if (mediaRecorder && mediaRecorder.state === "recording") {
          mediaRecorder.stop();
        }
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
        }
        startConvoBtn.disabled = false;
        stopConvoBtn.disabled = true;
        loading.style.display = "none";
      });

      socket.on("analysis_result", (data) => {
        loading.style.display = "none";
        document.getElementById("error_message").style.display = "none";
        document.getElementById(
          "stt_result"
        ).innerHTML = `<strong>STT Transcript:</strong> ${
          data.transcript || "N/A"
        }`;
        document.getElementById(
          "tone_result"
        ).innerHTML = `<strong>Tone Analysis:</strong> ${JSON.stringify(
          data.tone || {}
        )}`;
        document.getElementById(
          "nlu_result"
        ).innerHTML = `<strong>NLU Result:</strong> ${JSON.stringify(
          data.nlu || {}
        )}`;
        document.getElementById(
          "facial_result"
        ).innerHTML = `<strong>Facial Emotion:</strong> ${JSON.stringify(
          data.facial_emotion || {}
        )}`;
        document.getElementById(
          "memory_result"
        ).innerHTML = `<strong>Memory Updated</strong>`;
        updateHistories();
        updateLogs();
      });

      socket.on("analysis_error", (data) => {
        loading.style.display = "none";
        document.getElementById("error_message").style.display = "block";
        document.getElementById("error_message").innerText = "Analysis Error: " + data.error;
      });

      function updateHistories() {
        fetch("/get_working_history")
          .then((response) => response.json())
          .then((data) => {
            const content = data
              .map(
                (item) =>
                  `<p><strong>User:</strong> ${
                    item.user_input
                  }<br><strong>Therapist:</strong> ${
                    item.system_output
                  }<br><strong>Tags:</strong> ${
                    item.emotion_tags ? item.emotion_tags.join(", ") : "None"
                  }</p>`
              )
              .join("");
            document.getElementById("working_content").innerHTML = content;
          });

        fetch("/get_long_term_history")
          .then((response) => response.json())
          .then((data) => {
            const content = data
              .map(
                (item) =>
                  `<p><strong>Timestamp:</strong> ${
                    item.timestamp
                  }<br><strong>User:</strong> ${
                    item.user_input
                  }<br><strong>Therapist:</strong> ${
                    item.system_output
                  }<br><strong>Tags:</strong> ${
                    item.emotion_tags ? item.emotion_tags.join(", ") : "None"
                  }</p>`
              )
              .join("");
            document.getElementById("long_term_content").innerHTML = content;
          });
      }

      function updateLogs() {
        fetch("/get_logs")
          .then((response) => response.json())
          .then((data) => {
            const content = data.map((log) => `<p>${log}</p>`).join("");
            document.getElementById("logs_content").innerHTML = content;
          });
      }

      // Load histories and logs on page load
      window.onload = () => {
        updateHistories();
        updateLogs();
      };
    </script>
  </body>
</html>
